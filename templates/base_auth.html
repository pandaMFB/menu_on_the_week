{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Авторизация{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: relative;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Ключевое дополнение */
    }

    body::before {
      content: "";
      position: fixed;
      top: -1%;      /* Сдвиг за границы */
      left: -1%;     /* Сдвиг за границы */
      width: 102%;   /* Покрытие всего экрана */
      height: 102%;  /* Покрытие всего экрана */
      background-image: url("/static/img/food-background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(4px) brightness(0.7);
      -webkit-filter: blur(4px) brightness(0.7);
      z-index: -1;
      transform: translateZ(0); /* Улучшает рендеринг */
    }
  </style>

  {% block styles %}{% endblock %}
  {% block extra_styles %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}

{% block scripts %}
<!-- Bootstrap JS (если понадобится) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/forms.js' %}"></script>
{% endblock %}

</body>
</html>
