{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Меню на неделю{% endblock %}</title>

    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Блок для кастомных стилей -->
    {% block styles %}{% endblock %}
</head>
<body>
<header class="bg-primary text-white p-3">
    <h1>Меню на неделю</h1>
</header>

<main class="container mt-4">
    {% block content %}
    <!-- Содержимое страниц будет вставляться сюда -->
    {% endblock %}
</main>

<footer class="bg-light text-muted p-3 mt-5">
    &copy; 2025
</footer>

{% block scripts %}
<!-- Bootstrap JS (если понадобится) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/forms.js' %}"></script>
{% endblock %}

</body>
</html>
