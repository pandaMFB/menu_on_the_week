{% extends "base.html" %}
{% load static %}

{% block title %}Планер питания{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-5">Планер питания</h1>

    <div class="row">
        <div class="col-md-4 mb-4">
            <a href="{% url 'meal_planner:menu' %}" class="card text-white bg-primary text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Меню на неделю</h5>
                    <p class="card-text">Планируйте блюда по дням</p>
                </div>
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="{% url 'meal_planner:recipes' %}" class="card text-white bg-success text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Рецепты</h5>
                    <p class="card-text">Храните свои рецепты</p>
                </div>
            </a>
            <!-- Добавим ссылку на добавление рецепта прямо под карточкой или внутри?
                 Лучше под карточкой, чтобы не перегружать. -->
        </div>

        <div class="col-md-4 mb-4">
            <a href="{% url 'meal_planner:shopping_list' %}" class="card text-white bg-warning text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Список покупок</h5>
                    <p class="card-text">Управляйте списком продуктов</p>
                </div>
            </a>
        </div>
    </div>

    <!-- Дополнительная ссылка на добавление рецепта -->
    <div class="text-center mt-4">
        <a href="{% url 'meal_planner:add_recipe' %}" class="btn btn-outline-primary">➕ Добавить рецепт</a>
    </div>
</div>
{% endblock %}
