{% extends "base_auth.html" %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-form-container">
  <h1>Восстановление пароля</h1>
  <p>Введите ваш email, чтобы получить инструкцию по восстановлению пароля.</p>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_email">Email</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn-login">Отправить</button>
  </form>

  <div class="auth-links" style="margin-top: 1rem;">
    <a href="{% url 'accounts:login' %}">Назад к входу</a>
  </div>
</div>
{% endblock %}
